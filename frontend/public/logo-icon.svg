<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.75" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Container Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle Internal Highlight / Glass effect -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" fill="none" />

  <!-- Emblem: 2 People Connected forming "H" -->
  <g filter="url(#subtleGlow)">
    <!-- Left Person Head -->
    <circle cx="32" cy="23" r="6.5" fill="url(#glowGrad)" />
    <!-- Right Person Head -->
    <circle cx="68" cy="23" r="6.5" fill="url(#glowGrad)" />

    <!-- Left Pillar (Person Body) -->
    <rect x="26" y="34" width="12" height="42" rx="6" fill="url(#glowGrad)" />

    <!-- Right Pillar (Person Body) -->
    <rect x="62" y="34" width="12" height="42" rx="6" fill="url(#glowGrad)" />

    <!-- Dynamic Connecting Bridge (Collaboration Wave forming 'H') -->
    <path d="M 32 57 C 46 57, 50 45, 68 45 C 72 45 72 52 68 52 C 54 52, 50 64, 32 64 C 28 64 28 57 32 57 Z" fill="url(#bridgeGrad)" />
  </g>
</svg>
